name: Deploy Nest App to EC2

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Clean existing files in deployment directory
      - name: Clean Deployment Directory on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            deploy_dir="/home/ubuntu/projects/TBT_NestJS"
            cd "$deploy_dir"
            find . -mindepth 1 ! -name '.env' -exec rm -rf {} +

      # 3️⃣ Upload project files to EC2
      - name: Upload Source Code to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."                     # All files from repo
          target: "/home/ubuntu/projects/TBT_NestJS"

      # 4️⃣ Rebuild and restart the Docker service
      - name: Rebuild Docker Service on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projects/TBT_NestJS
            docker-compose build --no-cache tbt-backend
            docker-compose up -d tbt-backend