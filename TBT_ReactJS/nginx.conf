server {
    listen 80;
    server_name _;

    # Allow larger request bodies for file uploads (up to 20MB)
    # This must be greater than or equal to any limits enforced by the frontend.
    client_max_body_size 20M;

    root /usr/share/nginx/html;

    # Content-Security-Policy — unsafe-eval required by RingCentral Embeddable adapter.js
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ringcentral.github.io https://apps.ringcentral.com https://*.ringcentral.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://ringcentral.github.io https://apps.ringcentral.com https://*.ringcentral.com https://docs.google.com https://*.google.com; worker-src 'self' blob:; media-src 'self' blob:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

