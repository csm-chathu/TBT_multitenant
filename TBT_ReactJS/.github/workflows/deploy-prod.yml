name: Deploy React Vite App to EC2

on:
  # Trigger when a tag is pushed (e.g. `git tag v1.2.3 && git push origin v1.2.3`)
  push:
    tags:
      - 'v*'

  # Also trigger when a GitHub Release is published (optional)
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Upload project files to EC2
      - name: Upload Source Code to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"                    # All files from repo
          target: "/home/ubuntu/projects/TBT_ReactJS"

      # 3️⃣ Verify upload on EC2 
      - name: Verify Uploaded Files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ls -al /home/ubuntu/projects/TBT_ReactJS

      # 4️⃣ Rebuild and restart the Docker service 
      - name: Rebuild Docker Service on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/projects/TBT_ReactJS
            docker-compose build --no-cache tbt-reactjs
            docker-compose up -d tbt-reactjs
